<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Group A keeps the reservoir in a separate table, Group C on the plant; CESDM writes the link</title>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7585"/></marker></defs>
<rect width="860" height="330" rx="14" fill="#F6F7F9"/>
<rect x="20" y="20" width="300" height="130" rx="10" fill="#FFFFFF" stroke="#2E6E8E" stroke-width="2"/>
<text x="34" y="44" fill="#2E6E8E" font-size="14" font-weight="700">Group A: two tables</text>
<text x="34" y="70" fill="#26303D" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">plants.csv</text>
<text x="34" y="89" fill="#4A5463" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">CH_HYD_RES;CH;8500;6</text>
<text x="34" y="108" fill="#26303D" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">storage.csv</text>
<text x="34" y="127" fill="#4A5463" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">CH_RES;CH;8800000;20000000</text>
<text x="34" y="168" fill="#B03A2E" font-size="12">Which row belongs to which plant? Only by convention.</text>
<rect x="20" y="186" width="300" height="124" rx="10" fill="#FFFFFF" stroke="#A5622A" stroke-width="2"/>
<text x="34" y="210" fill="#A5622A" font-size="14" font-weight="700">Group C: on the plant</text>
<text x="34" y="236" fill="#4A5463" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">- id: hydro</text>
<text x="34" y="255" fill="#4A5463" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  cap_gw: 8.5</text>
<text x="34" y="274" fill="#4A5463" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  reservoir_twh: 8.8</text>
<text x="34" y="293" fill="#4A5463" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve">  inflow_twh: 20</text>
<rect x="440" y="40" width="390" height="250" rx="12" fill="#3E4C5E"/>
<text x="460" y="70" fill="#FFFFFF" font-size="16" font-weight="700">CESDM: the link is explicit</text>
<rect x="460" y="88" width="350" height="78" rx="8" fill="#4E5D71"/>
<text x="474" y="110" fill="#FFFFFF" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HydroGenerationUnit  gen.CH_HYD_RES</text>
<text x="474" y="132" fill="#D5DBE3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">nominal_power_capacity = 8500 MW</text>
<text x="474" y="154" fill="#D5DBE3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">drawsFromHydroReservoir</text>
<rect x="460" y="178" width="350" height="92" rx="8" fill="#4E5D71"/>
<text x="474" y="200" fill="#FFFFFF" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HydroReservoir  storage.CH_RES</text>
<text x="474" y="222" fill="#D5DBE3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">energy_storage_capacity = 8800000 MWh</text>
<text x="474" y="246" fill="#D5DBE3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">inflow = 20000000 MWh/year</text>
<path d="M322 85 C 380 85, 390 120, 434 125" stroke="#6B7585" stroke-width="2" fill="none" marker-end="url(#m)"/>
<path d="M322 248 C 380 248, 390 235, 434 235" stroke="#6B7585" stroke-width="2" fill="none" marker-end="url(#m)"/>
</svg>