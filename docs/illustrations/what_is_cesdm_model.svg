<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">What a CESDM model is</title>
  <desc id="desc">A schema-driven semantic description of a physical energy system — networks, assets, and profiles — independent of any single tool, solver, or file format.</desc>

  <defs>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .heading { font: 700 20px Inter, Arial, sans-serif; fill: #0F172A; }
      .label { font: 600 16px Inter, Arial, sans-serif; fill: #0F172A; }
      .small { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 13px Inter, Arial, sans-serif; fill: #64748B; }
      .chip-title { font: 600 15px Inter, Arial, sans-serif; fill: #0F172A; }
      .chip-body { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .model-box { fill: #EEF7F5; stroke: #16806F; stroke-width: 2.5; }
      .inner { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .asset { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 2; }
      .node { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2.5; }
      .line-seg { stroke: #64748B; stroke-width: 4; stroke-linecap: round; fill: none; }
      .flow { stroke: #2563EB; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .chip { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .chip-accent { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 2; }
      .profile { fill: none; stroke: #0EA5E9; stroke-width: 2.5; stroke-linecap: round; }
      .divider { stroke: #D9E2EA; stroke-width: 1.5; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="24" fill="#F8FAFC"/>

  <text x="600" y="48" text-anchor="middle" class="title">A semantic description of the energy system</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">Schema-defined · tool-independent · not an analysis engine</text>

  <!-- Main CESDM model container -->
  <g filter="url(#shadow)">
    <rect x="70" y="105" width="1060" height="355" rx="28" class="model-box"/>
  </g>
  <text x="600" y="142" text-anchor="middle" class="heading">CESDM model</text>
  <text x="600" y="166" text-anchor="middle" class="small">One agreed, schema-driven description of the physical energy system</text>

  <!-- Mini topology -->
  <rect x="175" y="228" width="110" height="58" rx="14" class="asset"/>
  <text x="230" y="254" text-anchor="middle" class="label">Generator</text>
  <text x="230" y="274" text-anchor="middle" class="tiny">asset entity</text>

  <path d="M285 257 L352 257" class="flow"/>

  <circle cx="390" cy="257" r="30" class="node"/>
  <text x="390" y="262" text-anchor="middle" class="label">Node A</text>

  <rect x="355" y="188" width="70" height="44" rx="12" class="asset"/>
  <text x="390" y="216" text-anchor="middle" class="tiny">Storage</text>
  <path d="M390 232 L390 227" class="flow"/>

  <line x1="420" y1="257" x2="520" y2="257" class="line-seg"/>
  <text x="470" y="245" text-anchor="middle" class="tiny">Line</text>

  <circle cx="560" cy="257" r="30" class="node"/>
  <text x="560" y="262" text-anchor="middle" class="label">Node B</text>

  <line x1="590" y1="257" x2="660" y2="257" class="line-seg"/>

  <path d="M660 257 L727 257" class="flow"/>

  <rect x="730" y="228" width="100" height="58" rx="14" class="asset"/>
  <text x="780" y="254" text-anchor="middle" class="label">Load</text>
  <text x="780" y="274" text-anchor="middle" class="tiny">demand entity</text>

  <!-- Profile -->
  <rect x="860" y="208" width="220" height="88" rx="16" class="inner"/>
  <text x="970" y="232" text-anchor="middle" class="label">Profile</text>
  <path d="M885 270 C905 250, 925 285, 945 260 S985 275, 1005 255 S1045 280, 1065 265" class="profile"/>
  <text x="970" y="288" text-anchor="middle" class="tiny">time series on assets</text>

  <line x1="110" y1="320" x2="1090" y2="320" class="divider"/>

  <!-- Semantic building blocks -->
  <rect x="130" y="338" width="155" height="34" rx="10" class="inner"/>
  <text x="207" y="360" text-anchor="middle" class="tiny">entities</text>
  <rect x="305" y="338" width="155" height="34" rx="10" class="inner"/>
  <text x="382" y="360" text-anchor="middle" class="tiny">attributes</text>
  <rect x="480" y="338" width="155" height="34" rx="10" class="inner"/>
  <text x="557" y="360" text-anchor="middle" class="tiny">relations</text>
  <rect x="655" y="338" width="175" height="34" rx="10" class="inner"/>
  <text x="742" y="360" text-anchor="middle" class="tiny">carrier domains</text>
  <rect x="850" y="338" width="200" height="34" rx="10" class="inner"/>
  <text x="950" y="360" text-anchor="middle" class="tiny">validation · libraries</text>

  <!-- Principle chips -->
  <g filter="url(#shadow)">
    <rect x="70" y="485" width="320" height="88" rx="18" class="chip"/>
    <rect x="440" y="485" width="320" height="88" rx="18" class="chip"/>
    <rect x="810" y="485" width="320" height="88" rx="18" class="chip-accent"/>
  </g>

  <text x="230" y="518" text-anchor="middle" class="chip-title">Not a solver</text>
  <text x="230" y="542" text-anchor="middle" class="chip-body">No dispatch, power flow,</text>
  <text x="230" y="560" text-anchor="middle" class="chip-body">or simulation runs here</text>

  <text x="600" y="518" text-anchor="middle" class="chip-title">Not one vendor format</text>
  <text x="600" y="542" text-anchor="middle" class="chip-body">Meaning is separate from</text>
  <text x="600" y="560" text-anchor="middle" class="chip-body">tool-specific file layouts</text>

  <text x="970" y="518" text-anchor="middle" class="chip-title">Same meaning, many serializations</text>
  <text x="970" y="542" text-anchor="middle" class="chip-body">YAML · JSON · CSV ·</text>
  <text x="970" y="560" text-anchor="middle" class="chip-body">Frictionless packages · databases</text>
</svg>
