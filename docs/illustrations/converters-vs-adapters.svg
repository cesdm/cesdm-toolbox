<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Without a shared representation, four groups need six pairwise converters. With CESDM, each group writes one adapter.</title>
<rect width="860" height="340" rx="14" fill="#F6F7F9"/>
<rect x="20" y="20" width="400" height="300" rx="10" fill="#FFFFFF" stroke="#D5DBE3"/>
<rect x="440" y="20" width="400" height="300" rx="10" fill="#FFFFFF" stroke="#D5DBE3"/>
<text x="220" y="48" text-anchor="middle" fill="#26303D" font-size="14" font-weight="700">Without a shared representation</text>
<text x="640" y="48" text-anchor="middle" fill="#26303D" font-size="14" font-weight="700">With CESDM</text>

<!-- left: six pairwise converters -->
<g stroke="#A0A8B4" stroke-width="2">
<line x1="105" y1="100" x2="335" y2="100"/>
<line x1="105" y1="250" x2="335" y2="250"/>
<line x1="80" y1="112" x2="80" y2="238"/>
<line x1="360" y1="112" x2="360" y2="238"/>
<line x1="110" y1="115" x2="330" y2="235"/>
<line x1="330" y1="115" x2="110" y2="235"/>
</g>
<g font-size="11" fill="#4A5463" text-anchor="middle">
<text x="220" y="93">converter A↔B</text>
<text x="220" y="268">converter C↔D</text>
</g>

<!-- right: four adapters -->
<g stroke="#A0A8B4" stroke-width="2">
<line x1="525" y1="112" x2="600" y2="158"/>
<line x1="755" y1="112" x2="680" y2="158"/>
<line x1="525" y1="238" x2="600" y2="192"/>
<line x1="755" y1="238" x2="680" y2="192"/>
</g>
<rect x="585" y="152" width="110" height="46" rx="8" fill="#3E4C5E"/>
<text x="640" y="181" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">CESDM</text>
<g font-size="11" fill="#4A5463" text-anchor="middle">
<text x="548" y="146">adapter</text>
<text x="732" y="146">adapter</text>
<text x="548" y="214">adapter</text>
<text x="732" y="214">adapter</text>
</g>

<!-- group boxes -->
<g font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<rect x="45" y="80" width="70" height="40" rx="8" fill="#2E6E8E"/><text x="80" y="105">Group A</text>
<rect x="325" y="80" width="70" height="40" rx="8" fill="#3C7D4E"/><text x="360" y="105">Group B</text>
<rect x="45" y="230" width="70" height="40" rx="8" fill="#A5622A"/><text x="80" y="255">Group C</text>
<rect x="325" y="230" width="70" height="40" rx="8" fill="#6B4E8E"/><text x="360" y="255">Group D</text>
<rect x="465" y="80" width="70" height="40" rx="8" fill="#2E6E8E"/><text x="500" y="105">Group A</text>
<rect x="745" y="80" width="70" height="40" rx="8" fill="#3C7D4E"/><text x="780" y="105">Group B</text>
<rect x="465" y="230" width="70" height="40" rx="8" fill="#A5622A"/><text x="500" y="255">Group C</text>
<rect x="745" y="230" width="70" height="40" rx="8" fill="#6B4E8E"/><text x="780" y="255">Group D</text>
</g>

<g font-size="12.5" fill="#26303D" text-anchor="middle">
<text x="220" y="300"><tspan font-weight="700">6 converters</tspan>, each agreed between two groups</text>
<text x="640" y="300"><tspan font-weight="700">4 adapters</tspan>, each written by its own group</text>
</g>
</svg>
