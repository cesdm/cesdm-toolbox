<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The EAR engine knows no domain. CESDM is the energy-system domain built on it: the base, power-flow and dynamics schemas, the living-lab extension, and the cesdm layer. The bookshelf is a plain ear model beside it; its schema extends nothing.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7585"/></marker></defs>
<rect width="980" height="412" rx="14" fill="#F6F7F9"/>

<!-- column headers -->
<text x="454" y="22" text-anchor="middle" fill="#2E6E8E" font-size="13" font-weight="700">CESDM — the energy-system domain</text>
<text x="874" y="22" text-anchor="middle" fill="#6A4C93" font-size="13" font-weight="700">Another domain</text>

<!-- row labels -->
<g fill="#6B7585" font-size="11" font-weight="700" letter-spacing="0.6" text-anchor="end">
<text x="124" y="60">MODELS</text>
<text x="124" y="160">SCHEMA</text>
<text x="124" y="174">PACKAGES</text>
<text x="124" y="250">DOMAIN LAYER</text>
<text x="124" y="350">ENGINE</text>
</g>

<!-- models -->
<g font-size="11" fill="#26303D" text-anchor="middle">
<rect x="146" y="34" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#C9D1DB"/>
<text x="220" y="60">Energy system</text>
<rect x="302" y="34" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#C9D1DB"/>
<text x="376" y="60">… with power flow</text>
<rect x="458" y="34" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#C9D1DB"/>
<text x="532" y="60">… with dynamics</text>
<rect x="614" y="34" width="148" height="42" rx="8" fill="#FFFFFF" stroke="#C9D1DB"/>
<text x="688" y="60">living lab</text>
<rect x="798" y="34" width="152" height="42" rx="8" fill="#FFFFFF" stroke="#C9D1DB"/>
<text x="874" y="60">bookshelf</text>
</g>
<g stroke="#6B7585" stroke-width="1.6" marker-end="url(#a)">
<line x1="220" y1="122" x2="220" y2="80"/>
<line x1="376" y1="122" x2="376" y2="80"/>
<line x1="532" y1="122" x2="532" y2="80"/>
<line x1="688" y1="122" x2="688" y2="80"/>
<line x1="874" y1="122" x2="874" y2="80"/>
</g>

<!-- regions -->
<rect x="136" y="106" width="636" height="180" rx="12" fill="#EAF2F6" stroke="#2E6E8E" stroke-width="1.4"/>
<rect x="788" y="106" width="172" height="180" rx="12" fill="#F2EEF7" stroke="#6A4C93" stroke-width="1.4"/>

<!-- schema packages -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#26303D" text-anchor="middle">
<rect x="146" y="124" width="148" height="76" rx="8" fill="#FFFFFF" stroke="#2E6E8E"/>
<text x="220" y="146">schemas/cesdm</text>
<rect x="302" y="124" width="148" height="76" rx="8" fill="#FFFFFF" stroke="#2E6E8E"/>
<text x="376" y="146">cesdm_power_flow</text>
<rect x="458" y="124" width="148" height="76" rx="8" fill="#FFFFFF" stroke="#2E6E8E"/>
<text x="532" y="146">cesdm_dynamic</text>
<rect x="614" y="124" width="148" height="76" rx="8" fill="#FFFFFF" stroke="#2E6E8E"/>
<text x="688" y="146">living-lab schema</text>
<rect x="798" y="124" width="152" height="76" rx="8" fill="#FFFFFF" stroke="#6A4C93"/>
<text x="874" y="146">bookshelf schema</text>
</g>
<g font-size="11" fill="#4A5563" text-anchor="middle">
<text x="220" y="166">the base: assets,</text>
<text x="220" y="182">network, dispatch</text>
<text x="376" y="166">extends cesdm</text>
<text x="376" y="182">+ setpoints, Q limits</text>
<text x="532" y="166">extends cesdm</text>
<text x="532" y="182">+ machines, controllers</text>
<text x="688" y="166">extends cesdm</text>
<text x="688" y="182">+ households, survey</text>
<text x="874" y="166">extends nothing</text>
<text x="874" y="182">Author, Book</text>
</g>

<!-- domain layer -->
<rect x="146" y="214" width="616" height="60" rx="8" fill="#FFFFFF" stroke="#2E6E8E"/>
<text x="454" y="238" text-anchor="middle" fill="#26303D" font-size="12.5" font-weight="700">the cesdm package — CesdmModel</text>
<text x="454" y="258" text-anchor="middle" fill="#4A5563" font-size="11">libraries · hierarchical YAML · Excel · HDF5 profiles · proxies</text>
<rect x="798" y="214" width="152" height="60" rx="8" fill="#FFFFFF" stroke="#6A4C93"/>
<text x="874" y="238" text-anchor="middle" fill="#26303D" font-size="12.5" font-weight="700">ear.Model</text>
<text x="874" y="258" text-anchor="middle" fill="#4A5563" font-size="11.5">plain ear model</text>

<!-- engine -->
<rect x="136" y="304" width="824" height="88" rx="12" fill="#3D4756"/>
<text x="548" y="330" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">ear — the Entity–Attribute–Relation engine</text>
<text x="548" y="352" text-anchor="middle" fill="#9FD3C7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">add_entity · add_attribute · add_relation · validate() · validate_for_analysis() · import / export</text>
<text x="548" y="376" text-anchor="middle" fill="#D5DBE3" font-size="12.5">Knows no domain: every class, attribute, unit and link comes from the schema it loads.</text>
</svg>
