<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">First CESDM model: one bus with wind, PV, hydro and demand</title>
  <desc id="desc">Wind, PV and a hydro generator connect to one bus from above. Demand connects below PV. A reservoir is connected to the hydro unit.</desc>
  <style>
    .title { font: 700 26px Inter, Arial, sans-serif; fill: #0F172A; }
    .label { font: 700 17px Inter, Arial, sans-serif; fill: #0F172A; }
    .small { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
    .bus { font: 700 16px Inter, Arial, sans-serif; fill: #FFFFFF; }
    .lead { stroke: #64748B; stroke-width: 3; fill: none; stroke-linecap: round; }
    .water { stroke: #0284C7; stroke-width: 3; fill: none; stroke-linecap: round; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="water-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0284C7"/>
    </marker>

    <!-- Wind turbine -->
    <g id="icon-wind">
      <path d="M24 22 L24 44" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M17 44 H31" stroke="#334155" stroke-width="2.6" stroke-linecap="round"/>
      <g transform="translate(24 18)">
        <path d="M0 0 C3 -9 3.5 -16 0 -18 C-3.5 -16 -3 -9 0 0 Z" fill="#2563EB"/>
        <path d="M0 0 C3 -9 3.5 -16 0 -18 C-3.5 -16 -3 -9 0 0 Z" fill="#3B82F6" transform="rotate(120)"/>
        <path d="M0 0 C3 -9 3.5 -16 0 -18 C-3.5 -16 -3 -9 0 0 Z" fill="#1D4ED8" transform="rotate(240)"/>
        <circle r="3.4" fill="#1E3A8A"/>
      </g>
    </g>

    <!-- Tilted PV array -->
    <g id="icon-pv">
      <circle cx="10" cy="10" r="5.5" fill="#F59E0B"/>
      <path d="M10 3 V6 M10 14 V17 M3 10 H6 M14 10 H17" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M8 22 L38 14 L42 30 L12 38 Z" fill="#1E3A8A"/>
      <path d="M15 20 L19 34 M23 18 L27 32 M31 16 L35 30 M11 26 H39 M10 31 H40" stroke="#93C5FD" stroke-width="1.1" opacity="0.9"/>
      <path d="M22 36 L24 44 M32 32 L34 44" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M16 44 H38" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Hydro generator: housing + turbine runner -->
    <g id="icon-hydro">
      <rect x="1" y="13" width="18" height="22" rx="3" fill="#0369A1"/>
      <rect x="4" y="17" width="12" height="2" rx="1" fill="#7DD3FC"/>
      <rect x="4" y="22" width="12" height="2" rx="1" fill="#7DD3FC"/>
      <rect x="4" y="27" width="12" height="2" rx="1" fill="#7DD3FC"/>
      <rect x="19" y="22" width="5" height="4" rx="1" fill="#475569"/>
      <circle cx="34" cy="24" r="13" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
      <g transform="translate(34 24)">
        <path d="M0 0 C4 -3 9 -7 8 -11 C3 -6 1 -3 0 0 Z" fill="#0284C7"/>
        <path d="M0 0 C4 -3 9 -7 8 -11 C3 -6 1 -3 0 0 Z" fill="#0369A1" transform="rotate(72)"/>
        <path d="M0 0 C4 -3 9 -7 8 -11 C3 -6 1 -3 0 0 Z" fill="#0284C7" transform="rotate(144)"/>
        <path d="M0 0 C4 -3 9 -7 8 -11 C3 -6 1 -3 0 0 Z" fill="#0369A1" transform="rotate(216)"/>
        <path d="M0 0 C4 -3 9 -7 8 -11 C3 -6 1 -3 0 0 Z" fill="#0284C7" transform="rotate(288)"/>
        <circle r="3.6" fill="#0C4A6E"/>
      </g>
    </g>

    <!-- Reservoir: lake and dam -->
    <g id="icon-reservoir">
      <path d="M4 20 H30 V40 H4 Z" fill="#38BDF8"/>
      <path d="M4 20 H30 V26 H4 Z" fill="#7DD3FC"/>
      <path d="M7 28 Q12 25 17 28 Q22 31 27 28" fill="none" stroke="#F0F9FF" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M7 34 Q12 31 17 34 Q22 37 27 34" fill="none" stroke="#BAE6FD" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M30 10 L44 40 H30 Z" fill="#94A3B8"/>
      <path d="M30 10 L34 10 L46 40 H44 Z" fill="#64748B"/>
      <path d="M30 10 L32 8 L36 8 L34 10 Z" fill="#475569"/>
    </g>

    <!-- Demand: city load -->
    <g id="icon-demand">
      <rect x="4" y="22" width="12" height="22" fill="#DC2626"/>
      <rect x="18" y="8" width="14" height="36" fill="#B91C1C"/>
      <path d="M32 16 L40 16 L40 44 L32 44 Z" fill="#EF4444"/>
      <path d="M32 16 L36 10 L40 16 Z" fill="#F87171"/>
      <rect x="7" y="26" width="2.4" height="2.4" fill="#FECACA"/>
      <rect x="11" y="26" width="2.4" height="2.4" fill="#FECACA"/>
      <rect x="7" y="31" width="2.4" height="2.4" fill="#FECACA"/>
      <rect x="11" y="31" width="2.4" height="2.4" fill="#FECACA"/>
      <rect x="21" y="13" width="2.6" height="3" fill="#FECACA"/>
      <rect x="26" y="13" width="2.6" height="3" fill="#FECACA"/>
      <rect x="21" y="19" width="2.6" height="3" fill="#FECACA"/>
      <rect x="26" y="19" width="2.6" height="3" fill="#FECACA"/>
      <rect x="21" y="25" width="2.6" height="3" fill="#FECACA"/>
      <rect x="26" y="25" width="2.6" height="3" fill="#FECACA"/>
      <rect x="34" y="22" width="2.2" height="2.2" fill="#FEE2E2"/>
      <rect x="38" y="22" width="2.2" height="2.2" fill="#FEE2E2"/>
      <rect x="34" y="27" width="2.2" height="2.2" fill="#FEE2E2"/>
      <rect x="38" y="27" width="2.2" height="2.2" fill="#FEE2E2"/>
      <path d="M2 44 H46" stroke="#7F1D1D" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1100" height="500" rx="24" fill="#F8FAFC"/>
  <text x="550" y="42" text-anchor="middle" class="title">What you just built</text>

  <line x1="170" y1="168" x2="170" y2="248" class="lead"/>
  <line x1="400" y1="168" x2="400" y2="248" class="lead"/>
  <line x1="630" y1="168" x2="630" y2="248" class="lead"/>
  <line x1="400" y1="278" x2="400" y2="318" class="lead"/>
  <line x1="760" y1="118" x2="720" y2="118" class="water" marker-end="url(#water-arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="68" width="180" height="100" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="310" y="68" width="180" height="100" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="540" y="68" width="180" height="100" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="760" y="68" width="180" height="100" rx="18" fill="#F0F9FF" stroke="#7DD3FC"/>
    <rect x="60" y="248" width="680" height="30" rx="8" fill="#1D4ED8"/>
    <rect x="310" y="318" width="180" height="100" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
  </g>

  <use href="#icon-wind" x="146" y="70"/>
  <text x="170" y="136" text-anchor="middle" class="label">Wind</text>
  <text x="170" y="154" text-anchor="middle" class="small">500 MW</text>

  <use href="#icon-pv" x="376" y="70"/>
  <text x="400" y="136" text-anchor="middle" class="label">PV</text>
  <text x="400" y="154" text-anchor="middle" class="small">300 MW</text>

  <use href="#icon-hydro" x="606" y="72"/>
  <text x="630" y="136" text-anchor="middle" class="label">Hydro</text>
  <text x="630" y="154" text-anchor="middle" class="small">200 MW</text>

  <use href="#icon-reservoir" x="826" y="70"/>
  <text x="850" y="136" text-anchor="middle" class="label">Reservoir</text>
  <text x="850" y="154" text-anchor="middle" class="small">50 GWh</text>

  <text x="400" y="269" text-anchor="middle" class="bus">bus</text>

  <use href="#icon-demand" x="376" y="320"/>
  <text x="400" y="386" text-anchor="middle" class="label">Demand</text>
  <text x="400" y="404" text-anchor="middle" class="small">2 TWh / year</text>

  <text x="550" y="460" text-anchor="middle" class="small">Wind, PV and hydro inject at the bus; demand is served from it. The reservoir is connected to the hydro unit.</text>
</svg>
