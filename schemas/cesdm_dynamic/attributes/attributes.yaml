      '
    value:
      type: decimal
      default: 0.5
    unit:
      constraints:
        enum:
        - pu
  GOV_HYGOV_qNL:
    label: qNL — no-load flow
    description: 'No-load water flow at rated head [pu of rated flow]. HYGOV.

      '
    value:
      type: decimal
      default: 0.08
      constraints:
        minimum: 0.0
    unit:
      constraints:
        enum:
        - pu
  PSS_Vs_max:
    label: Vs_max — PSS output upper limit
    description: 'Upper saturation limit on PSS supplementary voltage output [pu]. Injected at AVR summing
      junction. Typical: 0.05–0.15 pu.

      '
    value:
      type: decimal
      default: 0.1
    unit:
      constraints:
        enum:
        - pu
  PSS_Vs_min:
    label: Vs_min — PSS output lower limit
    description: 'Lower saturation limit on PSS supplementary voltage output [pu].

      '
    value:
      type: decimal
      default: -0.1
    unit:
      constraints:
        enum:
        - pu
  PSS_STAB1_Kstab:
    label: Kstab — stabiliser gain
    description: 'PSS forward path gain [pu]. STAB1 / PSS1A.

      '
    provenance_ref: IEEE Std 421.5-2016, PSS1A.
    value:
      type: decimal
      default: 20.0
      constraints:
        minimum: 0.0
    unit:
      constraints:
