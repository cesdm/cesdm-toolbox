name: EnergyAssetInstance
parents:
- SystemAsset
description: "Abstract base for a deployed energy infrastructure asset (generation, storage, conversion,
  transmission, demand, …).\nCarries optional capacity-expansion lifecycle slots (commissioning/retirement).
  Nodal models attach assets via topology (atNode / fromNode+toNode) on a NetworkNode.
  Zonal models may attach single-port assets via belongsToGeographicalRegion, and NTC-style
  interconnectors via fromRegion / toRegion, on a GeographicalRegion.\n"
attributes:
- id: commissioning_year
  required: false
  belongsToGroup: [capacity_expansion]
- id: retrofit_date
  required: false
  belongsToGroup: [capacity_expansion]
- id: retirement_date
  required: false
  belongsToGroup: [capacity_expansion]
abstract: true
