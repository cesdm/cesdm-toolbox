name: HVDCLink
parents:
- TransmissionElement
description: HVDC transmission link. Converter technology is represented by converter_technology
  (LCC or VSC), not by subclasses.
attributes:
- id: converter_technology
  required: false
- id: hvdc_technology_type
  required: true
  belongsToGroup: [power_flow]
- id: dc_voltage_kv
  required: false
  belongsToGroup: [power_flow]
- id: active_power_setpoint_from_to
  required: false
  belongsToGroup: [power_flow]
- id: p_max_hvdc
  required: true
  belongsToGroup: [power_flow]
- id: p_min_hvdc
  required: false
  belongsToGroup: [power_flow]
- id: converter_loss_coefficient
  required: false
  belongsToGroup: [power_flow]
- id: converter_rating_from
  required: false
  belongsToGroup: [power_flow]
- id: converter_rating_to
  required: false
  belongsToGroup: [power_flow]
- id: max_flow
  required: true
  belongsToGroup: [dispatch]
- id: variable_operating_cost
  required: false
  belongsToGroup: [dispatch]
