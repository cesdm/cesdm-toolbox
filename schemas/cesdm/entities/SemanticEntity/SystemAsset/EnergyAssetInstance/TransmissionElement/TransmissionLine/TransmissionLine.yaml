name: TransmissionLine
parents:
- TransmissionElement
description: 'A specific deployed AC or DC transmission line or underground cable
  carrying an electrical carrier between two ElectricalBuses. Physical parameters
  (series impedance, shunt susceptance, length, parallel circuits, thermal rating)
  are declared directly on this class. Topological connection (fromNode,
  toNode, switch states) is declared directly here as well.

  Maps to FlexEco class PN_Line.

  Examples: a 380 kV overhead line between substations A and B, a 220 kV underground
  cable, a 132 kV feeder.

  '
attributes:
- id: series_resistance_per_km
  required: false
  belongsToGroup: [power_flow]
- id: series_reactance_per_km
  required: false
  belongsToGroup: [power_flow]
- id: shunt_susceptance_per_km
  required: false
  belongsToGroup: [power_flow]
- id: line_length
  required: false
  belongsToGroup: [power_flow]
- id: parallel_circuit_count
  required: false
  belongsToGroup: [power_flow]
- id: thermal_capacity_rating
  required: false
  belongsToGroup: [power_flow]
