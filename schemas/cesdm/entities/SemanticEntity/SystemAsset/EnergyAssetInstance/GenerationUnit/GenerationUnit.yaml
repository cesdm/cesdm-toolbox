name: GenerationUnit
parents:
- EnergyAssetInstance
description: 'A deployed generation asset with stable identity, carrier/resource relations,
  and its own operational and topological data. Every attribute/relation below is
  tagged with belongsToGroup, indicating which analytical perspective (dispatch, topology,
  dynamics, ...) it belongs to.

  Technology-specific physical/design attributes that are mutually exclusive across
  technologies live on dedicated subclasses instead of here: HydroGenerationUnit (hydraulic_head,
  turbine_type, is_reversible, plus the ReservoirStorageUnit coupling), WindGenerationUnit
  (hub_height, rotor_diameter, installation_type, number_of_turbines), SolarGenerationUnit
  (tilt_angle, azimuth_angle, tracking_type, panel_technology), and ThermalGenerationUnit
  (cooling_type, reactor_type, thermal_capacity). Use one of these subclasses instead
  of GenerationUnit directly whenever the technology matches; use GenerationUnit directly
  only for a generic or as-yet-unclassified generation asset.'
