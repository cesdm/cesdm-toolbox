name: Result
abstract: true
parents:
- SemanticEntity
description: >-
  Abstract base for all analysis-run results, regardless of which
  analysis domain (dispatch, power-flow, dynamics, ...) produced them.
  A standalone entity: a result is
  inherently multi-valued per asset (one per analysis run), the same
  reasoning that keeps AVR/governor/PSS controllers as standalone
  entities rather than attributes directly on the asset.

  Every result carries hasRunRecord, linking back to the RunRecord
  that produced it -- this is what allows results from multiple runs,
  and multiple analysis domains, to coexist on the same asset without
  collision. Each domain's abstract base (DispatchResult,
  PowerFlowResult, DynamicResult) narrows hasRunRecord's target to its
  own RunRecord subclass.
relations:
- id: representsAsset
  required: true
- id: hasRunRecord
  required: true
  target: RunRecord
