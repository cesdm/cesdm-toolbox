[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cesdm"
version = "1.0.0"
description = "Common Energy System Domain Model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Research Center for Energy Networks - ETH Zürich" }
]
keywords = [
  "energy systems",
  "semantic modelling",
  "data model",
  "interoperability",
  "schemas",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.23",
  "h5py>=3.8",
  "pandas>=1.5",
  "openpyxl>=3.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Notebooks. The docs install this as `pip install -e ".[jupyter]"`.
jupyter = [
  "jupyterlab>=4.0",
  "notebook>=7.0",
  "ipykernel>=6.0",
]

# Numerical profile export/import, HDF5 time series, and common examples.
data = [
  "numpy>=1.23",
  "h5py>=3.8",
  "pandas>=1.5",
]

# Spreadsheet and tabular exchange formats.
excel = [
  "openpyxl>=3.1",
]
parquet = [
  "pyarrow>=12",
]

# External model importers. Install only when needed.
pypsa = [
  "pypsa>=0.26",
  "numpy>=1.23",
  "pandas>=1.5",
  "h5py>=3.8",
]
tyndp = [
  "numpy>=1.23",
  "pandas>=1.5",
  "h5py>=3.8",
]
pandapower = [
  "pandapower>=2.14",
]
matpower = [
  "pypower>=5.1",
  "scipy>=1.10",
]
geo = [
  "geopandas>=0.13",
]

# RDF/OWL schema export (export_rdf_schema).
rdf = [
  "rdflib>=6.0",
]

# Runtime pydantic model generation (build_pydantic_models). Was already a
# lazy-imported optional dependency; formalized here for discoverability.
pydantic = [
  "pydantic>=2.0",
]

# Documentation build (MkDocs Material -- see GITHUB_PAGES_SETUP.md).
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-redirects>=1.2",
  "mkdocstrings[python]>=0.27",
  "pymdown-extensions>=10.8",
]

# Development and testing.
dev = [
  "pytest>=7",
  "ruff>=0.4",
  "black>=24",
  "build>=1",
  "pyright>=1.1",
  # Real Frictionless Data Package validator, used by
  # tests/test_export_frictionless_foreign_keys.py to check the
  # exported datapackage.json against the actual frictionless
  # package rather than only CESDM's own internal checks. That one
  # test skips gracefully if this isn't installed.
  "frictionless>=5.15",
]

# Convenience bundle for users who want all optional capabilities.
all = [
  "numpy>=1.23",
  "pandas>=1.5",
  "h5py>=3.8",
  "openpyxl>=3.1",
  "pyarrow>=12",
  "pypsa>=0.26",
  "geopandas>=0.13",
  "pandapower>=2.14",
  "pypower>=5.1",
  "scipy>=1.10",
  "rdflib>=6.0",
  "pydantic>=2.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-redirects>=1.2",
  "mkdocstrings[python]>=0.27",
  "pymdown-extensions>=10.8",
  "pytest>=7",
  "ruff>=0.4",
  "black>=24",
  "build>=1",
  "pyright>=1.1",
  "frictionless>=5.15",
  "jupyterlab>=4.0",
  "notebook>=7.0",
  "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://cesdm.github.io/cesdm-toolbox/"
Documentation = "https://cesdm.github.io/cesdm-toolbox/"
Repository = "https://github.com/cesdm/cesdm-toolbox"

[tool.setuptools]
# cesdm_toolbox.py / ear_toolbox.py are kept as thin backward-compatible
# shims re-exporting the "cesdm" / "ear" packages below (see
# docs/architecture/package_layout.md). New code should import from the
# packages directly.
py-modules = ["cesdm_toolbox", "ear_toolbox"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ear*", "cesdm*"]
exclude = ["tools*"]

# Schemas, libraries and analysis profiles live inside the cesdm package,
# so a wheel ships them. `tools` stays out: a top-level tools package
# clashes with other projects. From a checkout, `python -m tools....` still works.
[tool.setuptools.package-data]
cesdm = ["schemas/**/*", "library/**/*", "analysis_profiles/**/*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pyright]
# Resolves the .pyi stubs generated by tools/generate_typings.py
# (see README.md, "Editor typings") automatically for anyone opening
# this repo in Pyright/Pylance -- no separate pyrightconfig.json
# needed. Regenerate typings/ after schema or CesdmModel-mixin
# signature changes; this config just tells Pyright where to look.
stubPath = "typings"
