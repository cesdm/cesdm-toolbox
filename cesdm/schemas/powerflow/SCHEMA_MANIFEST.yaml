# Power-flow extension of the CESDM base schema.
#
# Load this package when a study needs load-flow fields (bus type, line
# impedance, voltage setpoints) or ShuntUnit.
# `extends` pulls in cesdm/schemas/base, so this path alone is enough:
#
#   build_model_from_yaml("cesdm/schemas/powerflow")

# Recorded in exported files. The folder is ``powerflow``.
name: cesdm-powerflow

version: "1.0.0"

description: >
  Power-flow fields and classes for CESDM. Builds on the dispatch base schema.

extends:
  - ../base

stability:
  assets: experimental
  attributes: experimental
  relations: experimental
  power_flow: experimental
