name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,excel]"

      - name: Run tests
        run: pytest

      - name: Ruff (undefined names and duplicate dict keys)
        run: ruff check --select F601,F821 ear cesdm tools

  swiss-analyses:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and pandapower
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pandapower]"

      - name: Rebuild the Swiss analysis chain
        run: |
          python docs/examples/swiss-analyses/step1_complete.py
          python docs/examples/swiss-analyses/step2_dispatch.py
          python docs/examples/swiss-analyses/step3_power_flow.py | tee /tmp/swiss-power-flow.txt
          grep -q "6822 MW" /tmp/swiss-power-flow.txt
          grep -q "0.954 pu" /tmp/swiss-power-flow.txt
          grep -q "251.0 MW of losses" /tmp/swiss-power-flow.txt
          python docs/examples/swiss-analyses/step4_dynamics.py
          # Fail if the chain wrote next to the checkout instead of inside it.
          test -f output/swiss-analyses/system.yaml
          test -f output/swiss-analyses/dispatch.yaml
          test -f output/swiss-analyses/power_flow.yaml
          test -f output/swiss-analyses/dynamics.yaml
          test -f output/swiss-analyses/profiles.h5
