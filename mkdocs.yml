site_name: CESDM
site_description: Common Energy System Domain Model — exchange energy-system models between research groups, each keeping its own tool and representation
site_url: https://cesdm.github.io/cesdm-toolbox/
repo_name: cesdm/cesdm-toolbox
repo_url: https://github.com/cesdm/cesdm-toolbox
edit_uri: edit/main/docs/
copyright: Copyright &copy; Research Center for Energy Networks, ETH Zürich
strict: true
use_directory_urls: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/schema-diagrams.css
extra_javascript:
  - javascripts/palette-toggle.js
  - javascripts/toc-collapse.js
  - javascripts/schema-diagrams.js

theme:
  name: material
  language: en
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - navigation.footer
  - navigation.tracking
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  - content.action.edit
  palette:
  - scheme: default
    primary: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode

nav:
- Home: index.md
- Get started: get-started.md
- Tutorial:
  - "Part 1: Data exchange between four groups":
    - tutorial/index.md
    - 1. Writing adapters: tutorial/1-map.md
    - 2. Validation of CESDM files: tutorial/2-check.md
    - 3. Exchanging with other groups: tutorial/3-exchange.md
  - "Part 2: Multiple analyses on the same data":
    - tutorial/analyses/index.md
    - 1. Checking for completeness: tutorial/analyses/1-complete.md
    - 2. The dispatch layer: tutorial/analyses/2-dispatch.md
    - 3. The power-flow layer: tutorial/analyses/3-power-flow.md
    - 4. The dynamics layer: tutorial/analyses/4-dynamics.md
- Concepts:
  - concepts/index.md
  - Entity, attribute, relation: concepts/ear.md
  - The EAR engine and CESDM: concepts/engine.md
  - Schemas: concepts/schemas.md
  - Validation: concepts/validation.md
  - The energy data model: concepts/energy-model.md
- Guides:
  - Best practices for writing adapters: guides/write-an-adapter.md
  - Build a model directly: guides/build-a-model.md
  - Write models with the proxy API: guides/proxy-api.md
  - Use TYNDP and PyPSA data: guides/real-data.md
  - Carrier domains: guides/carrier-domains.md
  - Extend the schema: guides/extend.md
  - Energy and society: guides/energy-and-society.md
- Reference:
  - reference/index.md
  - Using the schema reference: reference/using-schema-reference.md
  - API: reference/api.md
  - Schema diagrams:
    - reference/schema-diagrams/index.md
    - Assets: reference/schema-diagrams/assets.md
    - Network: reference/schema-diagrams/network.md
    - Conversion units: reference/schema-diagrams/conversion.md
    - Technologies: reference/schema-diagrams/technologies.md
    - System and time series: reference/schema-diagrams/time-series.md
    - Dynamics: reference/schema-diagrams/dynamics.md
    - Results: reference/schema-diagrams/results.md
  - Glossary: reference/glossary.md
- About:
  - FAQ: project/faq.md
  - Roadmap and releases: project/roadmap.md
  - Contribute and cite: project/contribute.md
  - Acknowledgement: project/acknowledgement.md
  - Related work: project/related-work.md

